<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparex - منصة مقارنة الأجهزة</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --gray: #64748b;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 10px; }
        .selection-box { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        select, input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; outline: none; box-sizing: border-box; }
        select:focus, input:focus { border-color: var(--primary); }
        .btn-compare { background-color: var(--primary); color: white; border: none; width: 90%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        th, td { padding: 16px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        th { background-color: var(--primary); color: white; }
        .price-row { font-weight: bold; font-size: 18px; color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Comparex 📱💻</h1>
            <p>اختر الفئة وقارن بين الأجهزة بسهولة</p>
        </header>

        <div class="selection-box">
            <select id="category" onchange="showInputs()">
                <option value="">-- اختر الفئة المراد مقارنتها --</option>
                <option value="mobiles">موبايلات</option>
                <option value="laptops">لابتوبات</option>
                <option value="appliances">أجهزة كهربائية</option>
            </select>

            <div id="inputs" style="display: none;">
                <input type="text" id="device1" placeholder="اكتب اسم الموديل الأول (مثل: iphone 15)...">
                <input type="text" id="device2" placeholder="اكتب اسم الموديل الثاني (مثل: samsung s23)...">
                <button class="btn-compare" onclick="compare()">عرض المقارنة</button>
            </div>
        </div>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>المواصفات</th>
                    <th id="name1">الجهاز الأول</th>
                    <th id="name2">الجهاز الثاني</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>السعر</td>
                    <td id="price1" class="price-row">-</td>
                    <td id="price2" class="price-row">-</td>
                </tr>
                <tr>
                    <td>المعالج</td>
                    <td id="cpu1">-</td>
                    <td id="cpu2">-</td>
