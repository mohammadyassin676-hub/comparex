.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(15,23,42,.08);margin-bottom:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tabs button{padding:12px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;font-size:15px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{position:relative}
input{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font-size:15px;background:var(--card);color:var(--text);outline:none}
.field:nth-child(1) input:focus{border-color:var(--a)}.field:nth-child(2) input:focus{border-color:var(--b)}
.sug{position:absolute;top:100%;right:0;left:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;box-shadow:0 10px 24px rgba(0,0,0,.18);overflow:hidden}
.sug div{padding:11px 12px;cursor:pointer;font-size:14px}.sug div:hover{background:var(--bg)}
.note{font-size:12px;color:var(--gray);margin:6px 2px 0;min-height:16px}
.empty{text-align:center;color:var(--gray);padding:26px 0 8px;font-size:14px}
.verdict{border:2px solid var(--pri);background:linear-gradient(135deg,rgba(79,70,229,.08),rgba(124,58,237,.08))}
.verdict h2{margin:0 0 6px;font-size:13px;color:var(--gray);font-weight:600}
.verdict .w{font-size:22px;font-weight:800;color:var(--pri);margin-bottom:6px}
.verdict p{margin:4px 0;font-size:14px;line-height:1.7}
.fine{font-size:11px;color:var(--gray);margin-top:8px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin-bottom:12px}
.big{font-size:34px;font-weight:800}.sa{color:var(--a)}.sb{color:var(--b)}
.ax{margin:10px 0}.ax .l{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);margin-bottom:4px}
.bar{display:flex;gap:4px;height:9px}.bar i{display:block;border-radius:5px;min-width:2px}
.bar .ba{background:var(--a)}.bar .bb{background:var(--b)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th.a{color:var(--a)}th.b{color:#d97706}
td:first-child{color:var(--gray);width:24%;font-size:13px}
td.win{background:var(--win);color:var(--wint);font-weight:700}

  const t=q.split(" "),c=q.replace(/ /g,"");
  return CATS[cat].data.map(d=>{
    const h=norm(d.name+" "+d.alias),hc=h.replace(/ /g,"");
    if(!(t.every(x=>h.includes(x))||hc.includes(c))) return null;
    return {d,s:(norm(d.name).startsWith(q)?0:1)+d.name.length/100};
  }).filter(Boolean).sort((x,y)=>x.s-y.s).map(r=>r.d);
}
function onType(k){
  const q=$(k).value,res=search(q),box=$("s"+k);
  pick[k]=res[0]||null;
  $("n"+k).textContent=q.trim()?(res.length?"✔ "+res[0].name:"مفيش جهاز بالاسم ده"):"";
  box.innerHTML=res.length>1?res.slice(0,6).map((d,i)=>`<div data-i="${i}">${d.name}</div>`).join(""):"";
  box.hidden=res.length<=1; box._r=res; render();
}
["a","b"].forEach(k=>{
  $(k).addEventListener("input",()=>onType(k));
  $("s"+k).addEventListener("click",e=>{
    const i=e.target.dataset.i; if(i==null) return;
    const d=$("s"+k)._r[i]; $(k).value=d.name; pick[k]=d; $("n"+k).textContent="✔ "+d.name; $("s"+k).hidden=true; render();
  });
});
document.addEventListener("click",e=>{if(!e.target.closest(".field"))document.querySelectorAll(".sug").forEach(s=>s.hidden=true)});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  cat=b.dataset.c; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b)); setCat();
});
function setCat(){
  ["a","b"].forEach((k,i)=>{$(k).value="";$("n"+k).textContent="";pick[k]=null;$(k).placeholder=(i?"الجهاز الثاني":"الجهاز الأول")+" (مثال: "+CATS[cat].ph[i]+")"});
  render();
}
function scoreOf(d){const C=CATS[cat];const ax=C.axes.map(([l,f,w])=>({l,v:f(d)*100,w}));return {ax,total:ax.reduce((s,x)=>s+x.v*x.w,0)}}

function render(){
  const A=pick.a,B=pick.b,C=CATS[cat];
  if(!A||!B){$("out").innerHTML='<div class="card empty">اكتب اسم الجهازين بشكل مبسط وهتظهر المقارنة والتفضيل</div>';return}
  const sa=scoreOf(A),sb=scoreOf(B),ta=Math.round(sa.total),tb=Math.round(sb.total);
  let v;
  if(Math.abs(ta-tb)<3){
    v=`<div class="w">متقاربين جداً 🤝</div><p>الفرق بين الجهازين (${ta} مقابل ${tb}) صغير، فالاختيار يعتمد على أولوياتك.</p>`;
  }else{
    const aw=ta>tb,W=aw?A:B,Lo=aw?B:A,SW=aw?sa:sb,SL=aw?sb:sa;
    const diffs=SW.ax.map((x,i)=>({l:x.l,d:x.v-SL.ax[i].v}));
    const lead=diffs.filter(x=>x.d>=8).sort((x,y)=>y.d-x.d).slice(0,2).map(x=>x.l);
    const back=diffs.filter(x=>x.d<=-8).sort((x,y)=>x.d-y.d)[0];
    v=`<div class="w">✅ التفضيل: ${W.name}</div><p>حصل على <b>${Math.max(ta,tb)}</b> من 100 مقابل <b>${Math.min(ta,tb)}</b> لـ ${Lo.name}.</p>`+
      (lead.length?`<p>أقوى في: ${lead.join(" و")}.</p>`:"")+
      (back?`<p>لكن ${Lo.name} أفضل في ${back.l}.</p>`:"");
  }
  const cmp=C.rows.map(([lb,f,g,low])=>{
    const x=g(A),y=g(B);let wa="",wb="";
    if(x!==y){const aw=low?x<y:x>y;aw?wa="win":wb="win"}
    return `<tr><td>${lb}</td><td class="${wa}">${f(A)}</td><td class="${wb}">${f(B)}</td></tr>`}).join("");
  const bars=sa.ax.map((x,i)=>{const y=sb.ax[i];return `<div class="ax"><div class="l"><span>${Math.round(x.v)}</span><b>${x.l}</b><span>${Math.round(y.v)}</span></div><div class="bar"><i class="ba" style="flex:${x.v+1}"></i><i class="bb" style="flex:${y.v+1}"></i></div></div>`}).join("");
  $("out").innerHTML=`
  <div class="card verdict"><h2>التفضيل حسب الأرقام</h2>${v}<div class="fine">التقييم محسوب من المواصفات فقط (الأداء، البطارية، الشاشة، الذاكرة...) بأوزان مختلفة لكل محور، ومش بيقيس جودة الصورة أو تجربة الاستخدام الفعلية.</div></div>
  <div class="card"><div class="scores"><div><div class="big sa">${ta}</div><div>${A.name}</div></div><div><div class="big sb">${tb}</div><div>${B.name}</div></div></div>${bars}</div>
  <div class="card tw"><table><thead><tr><th></th><th class="a">${A.name}</th><th class="b">${B.name}</th></tr></thead><tbody>${cmp}</tbody></table><div class="fine">الأرقام تقريبية، والخانة الخضراء = الأفضل في الصف.</div></div>`;
}
setCat();
</script>
</body>
</html>
