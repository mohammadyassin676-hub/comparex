<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقارن الأجهزة</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      line-height: 1.6;
    }

    .site-header {
      text-align: center;
      padding: 32px 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
    }
    .site-header h1 { font-size: 28px; margin-bottom: 6px; }
    .site-header p { opacity: 0.9; font-size: 15px; }

    .container { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }

    .selectors {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }
    .selector { flex: 1; min-width: 200px; }
    .selector label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    .selector select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
    }
    .vs {
      font-weight: 800;
      color: #7c3aed;
      font-size: 18px;
      padding: 0 8px;
    }

    .options {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }

    .table-wrapper {
      overflow-x: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #1f2937;
      color: #fff;
      padding: 14px 12px;
      font-size: 14px;
      text-align: center;
    }
    thead th:first-child { text-align: right; }
    tbody td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      text-align: center;
    }
    tbody td:first-child {
      text-align: right;
      font-weight: 600;
      background: #f9fafb;
    }
    tbody tr:hover { background: #f0f4ff; }

    td.diff {
      background: #fef3c7;
      font-weight: 600;
      color: #92400e;
    }

    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .vs { display: none; }
      .selector { min-width: 100%; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1>📱 مقارن الأجهزة</h1>
    <p>اختر جهازين وقارن بينهما بسهولة</p>
  </header>

  <main class="container">

    <section class="selectors">
      <div class="selector">
        <label>الجهاز الأول</label>
        <select id="device1"></select>
      </div>
      <div class="vs">VS</div>
      <div class="selector">
        <label>الجهاز الثاني</label>
        <select id="device2"></select>
      </div>
    </section>

    <section class="options">
      <label class="toggle">
        <input type="checkbox" id="diffOnly">
        <span>عرض الاختلافات فقط</span>
      </label>
    </section>

    <section class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>المواصفة</th>
            <th id="head1">—</th>
            <th id="head2">—</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

  </main>

  <script>
    const devices = [
      {
        id: "phone-a",
        name: "Phone A",
        specs: {
          screen: "6.1 بوصة OLED",
          battery: "4000 mAh",
          weight: "170g",
          camera: "50MP + 12MP",
          ram: "8GB",
          storage: "128GB",
          charging: "25W",
          os: "Android 14"
        }
      },
      {
        id: "phone-b",
        name: "Phone B",
        specs: {
          screen: "6.4 بوصة AMOLED",
          battery: "4500 mAh",
          weight: "185g",
          camera: "64MP + 8MP",
          ram: "8GB",
          storage: "256GB",
          charging: "45W",
          os: "Android 14"
        }
      }
    ];

    const specLabels = {
      screen: "الشاشة",
      battery: "البطارية",
      weight: "الوزن",
      camera: "الكاميرا",
      ram: "الذاكرة العشوائية",
      storage: "التخزين",
      charging: "الشحن",
      os: "نظام التشغيل"
    };

    const sel1 = document.getElementById("device1");
    const sel2 = document.getElementById("device2");
    const diffOnly = document.getElementById("diffOnly");
    const tableBody = document.getElementById("tableBody");
    const head1 = document.getElementById("head1");
    const head2 = document.getElementById("head2");

    function fillSelect(select, selectedId) {
      select.innerHTML = "";
      devices.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = d.name;
        if (d.id === selectedId) opt.selected = true;
        select.appendChild(opt);
      });
    }

    fillSelect(sel1, devices[0].id);
    fillSelect(sel2, devices[1].id);

    function compare() {
      const d1 = devices.find(d => d.id === sel1.value);
      const d2 = devices.find(d => d.id === sel2.value);
      const onlyDiff = diffOnly.checked;

      head1.textContent = d1.name;
      head2.textContent = d2.name;
      tableBody.innerHTML = "";

      Object.keys(specLabels).forEach(key => {
        const v1 = d1.specs[key] ?? "—";
        const v2 = d2.specs[key] ?? "—";
        const isDiff = String(v1) !== String(v2);

        if (onlyDiff && !isDiff) return;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${specLabels[key]}</td>
          <td class="${isDiff ? "diff" : ""}">${v1}</td>
          <td class="${isDiff ? "diff" : ""}">${v2}</td>
        `;
        tableBody.appendChild(tr);
      });

      if (!tableBody.children.length) {
        tableBody.innerHTML = `<tr><td colspan="3" class="empty-msg">لا توجد اختلافات بين الجهازين</td></tr>`;
      }
    }

    diffOnly.addEventListener("change", compare);
    sel1.addEventListener("change", compare);
    sel2.addEventListener("change", compare);

    compare();
  </script>

</body>
</html>
