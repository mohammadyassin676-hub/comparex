<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparex | قارن أي جهازين بالأرقام</title>
<style>
:root{--pri:#6366f1;--pri2:#8b5cf6;--bg:#f4f6fb;--card:#fff;--text:#0f172a;--gray:#64748b;--line:#e8ecf4;--a:#6366f1;--b:#f59e0b;--win:#e7f9ee;--wint:#15803d;--sh:0 10px 30px rgba(30,41,90,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0a0f1f;--card:#141b30;--text:#f1f5f9;--gray:#94a3b8;--line:#26304d;--win:#10341f;--wint:#86efac;--sh:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);margin:0;line-height:1.5}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#c026d3);color:#fff;text-align:center;padding:34px 16px 78px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero:before{width:240px;height:240px;top:-90px;left:-60px}.hero:after{width:180px;height:180px;bottom:-80px;right:-40px}
.hero h1{margin:0;font-size:32px;letter-spacing:.5px;position:relative}
.hero p{margin:8px 0 14px;opacity:.9;font-size:14px;position:relative}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;position:relative}
.wrap{max-width:860px;margin:-52px auto 28px;padding:0 14px;position:relative}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px;border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px;margin-bottom:14px}
.tabs button{padding:12px;border:0;background:transparent;color:var(--gray);border-radius:10px;font-size:15px;cursor:pointer;font-weight:700;transition:.2s}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 3px 10px rgba(30,41,90,.12)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.vs{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;z-index:3;box-shadow:0 4px 10px rgba(99,102,241,.4)}
.field{position:relative}
input{width:100%;padding:14px 12px;border:2px solid var(--line);border-radius:14px;font-size:15px;background:var(--card);color:var(--text);outline:none;transition:.2s}
.field:nth-child(1) input:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(99,102,241,.12)}
.field:nth-child(2) input:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(245,158,11,.14)}
.sug{position:absolute;top:100%;right:0;left:0;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:6px;box-shadow:0 14px 30px rgba(0,0,0,.2);overflow:hidden}
.sug div{padding:12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}.sug div:last-child{border:0}.sug div:hover{background:var(--bg)}
.note{font-size:12px;color:var(--gray);margin:6px 4px 0;min-height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;margin-top:6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips b{font-size:12px;color:var(--gray);align-self:center;white-space:nowrap}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 13px;border-radius:99px;font-size:12.5px;cursor:pointer;font-weight:600}
.chips button:active{background:var(--bg)}
.empty{text-align:center;color:var(--gray);padding:34px 10px;font-size:14px}.empty .big{font-size:40px;display:block;margin-bottom:6px}
.sk{height:90px;border-radius:16px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.heads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dev{position:relative;text-align:center;padding:18px 10px 14px;border-radius:20px;background:var(--card);border:2px solid var(--line);box-shadow:var(--sh)}
.dev.w{border-color:var(--c)}
.dev .crown{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--c);color:#fff;font-size:11px;font-weight:800;padding:3px 12px;border-radius:99px;white-space:nowrap}
.ring{--c:var(--a);width:92px;height:92px;margin:0 auto 10px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--c)}
.dev h3{margin:0;font-size:15px}.dev small{color:var(--gray);font-size:12px}
.verdict{margin-top:14px;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(192,38,211,.1));border:1px solid rgba(99,102,241,.3)}
.verdict .w{font-size:20px;font-weight:800;margin-bottom:6px}
.verdict p{margin:4px 0;font-size:14px}
.sec{margin:0 0 12px;font-size:15px;font-weight:800}
.ax{margin:14px 0}.ax .l{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;font-size:13px;margin-bottom:6px;text-align:center}
.ax .l b{font-weight:700}.ax .l span{font-weight:800;font-size:13px}.ax .l span:first-child{color:var(--a)}.ax .l span:last-child{color:#d97706}
.bar{display:flex;gap:4px;height:10px}.bar i{display:block;border-radius:6px;min-width:3px}
.ba{background:linear-gradient(90deg,#818cf8,var(--a))}.bb{background:linear-gradient(90deg,#fbbf24,var(--b))}
.tw{overflow-x:auto;padding:6px 8px}table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:13px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border:0}
th{font-size:13px;color:var(--text)}th.a{color:var(--a)}th.b{color:#d97706}
td:first-child{color:var(--gray);width:27%;font-size:13px;text-align:right;white-space:nowrap}
td.win{background:var(--win);color:var(--wint);font-weight:800;border-radius:10px}
td small{color:var(--gray);font-weight:500}
.fine{font-size:11.5px;color:var(--gray);margin-top:10px;line-height:1.7}
footer{text-align:center;color:var(--gray);font-size:12px;padding:6px 16px 28px}
@media(max-width:420px){.hero h1{font-size:27px}.ring{width:80px;height:80px}.ring span{width:64px;height:64px;font-size:22px}th,td{font-size:13px;padding:11px 4px}}
</style>
</head>
<body>
<div class="hero"><h1>Comparex 📱💻</h1><p>قارن أي جهازين بالأرقام واعرف الأفضل في ثواني</p><span class="badge" id="cnt">⚡ جاري التحميل...</span></div>
<div class="wrap">
  <div class="card">
    <div class="tabs"><button data-c="mobiles" class="on">📱 موبايلات</button><button data-c="laptops">💻 لابتوبات</button></div>
    <div class="pick">
      <div class="vs">VS</div>
      <div class="field"><input id="a" autocomplete="off"><div class="sug" id="sa" hidden></div><div class="note" id="na"></div></div>
      <div class="field"><input id="b" autocomplete="off"><div class="sug" id="sb" hidden></div><div class="note" id="nb"></div></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="out"></div>
</div>
<footer>Comparex • المقارنة محسوبة من المواصفات والأرقام تقريبية</footer>
<script>
const SB_URL="https://njsudqbqqjdogletstaz.supabase.co";
const SB_KEY="sb_publishable_ooZAB5eDYAJBV6UDH1HihA_ejKbyicx"; // مفتاح عام، آمن للاستخدام هنا
const M=[],L=[];
const n=(v,lo,hi)=>Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
const CATS={
 mobiles:{data:M,ico:"📱",ph:["s26 ultra","ايفون 17"],
  quick:[["s26 ultra","17 pro max"],["a57","a56"],["redmi note 15 pro","note 14 pro"],["pixel 10 pro","s26"],["honor 600 pro","magic8 pro"]],
  rows:[["الشاشة",d=>`${d.inch}" • ${d.hz}Hz`,d=>d.hz],["المعالج",d=>`${d.cpu}<br><small>${d.perf} نقطة</small>`,d=>d.perf],["الرام",d=>d.ram+"GB",d=>d.ram],["التخزين",d=>d.sto+"GB",d=>d.sto],["الكاميرا الرئيسية",d=>d.cam+" م.ب",d=>d.cam],["البطارية",d=>d.bat+" mAh",d=>d.bat],["الشحن السريع",d=>d.w+"W",d=>d.w],["الوزن",d=>d.g+" جم",d=>d.g,1],["سنة الإصدار",d=>d.year,d=>d.year]],
  axes:[["الأداء",d=>n(d.perf,2500,11000),.30],["البطارية والشحن",d=>.7*n(d.bat,3000,7500)+.3*n(d.w,15,100),.25],["الشاشة",d=>.6*n(d.hz,60,144)+.4*n(d.inch,6,6.9),.15],["الذاكرة",d=>.6*n(d.ram,4,16)+.4*n(d.sto,64,512),.20],["الكاميرا (حسب الأرقام)",d=>n(Math.sqrt(d.cam),4,14.2),.10]]},
 laptops:{data:L,ico:"💻",ph:["macbook","dell"],
  quick:[["macbook air m4","zenbook s"],["legion 5","rog zephyrus"],["xps 13","thinkpad x1"],["nitro 5","katana"]],
  rows:[["الشاشة",d=>`${d.inch}" • ${d.hz}Hz`,d=>d.hz],["المعالج",d=>`${d.cpu}<br><small>${d.perf} نقطة</small>`,d=>d.perf],["الرام",d=>d.ram+"GB",d=>d.ram],["التخزين SSD",d=>d.sto+"GB",d=>d.sto],["البطارية",d=>d.wh+" Wh",d=>d.wh],["الوزن",d=>d.kg+" كجم",d=>d.kg,1],["سنة الإصدار",d=>d.year,d=>d.year]],
  axes:[["الأداء",d=>n(d.perf,6000,18000),.35],["البطارية",d=>n(d.wh,45,75),.25],["الذاكرة",d=>.6*n(d.ram,8,32)+.4*n(d.sto,256,1024),.20],["خفة الوزن",d=>n(1.8-d.kg,0,.8),.10],["الشاشة",d=>.5*n(d.hz,60,165)+.5*n(d.inch,13,16),.10]]}
};
const IC={"الشاشة":"🖥️","المعالج":"⚡","الرام":"🧠","التخزين":"💾","التخزين SSD":"💾","الكاميرا الرئيسية":"📷","البطارية":"🔋","الشحن السريع":"🔌","الوزن":"⚖️","سنة الإصدار":"📅"};
const $=id=>document.getElementById(id);
let cat="mobiles",pick={a:null,b:null};
const norm=s=>s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^a-z0-9\u0600-\u06ff ]/g," ").replace(/\s+/g," ").trim();

function search(q){
  q=norm(q); if(!q) return [];
  const t=q.split(" "),c=q.replace(/ /g,"");
  return CATS[cat].data.map(d=>{
    const h=norm(d.name+" "+(d.alias||"")),hc=h.replace(/ /g,"");
    if(!(t.every(x=>h.includes(x))||hc.includes(c))) return null;
    return {d,s:(norm(d.name).startsWith(q)?0:1)+d.name.length/100};
  }).filter(Boolean).sort((x,y)=>x.s-y.s).map(r=>r.d);
}
function onType(k){
  const q=$(k).value,res=search(q),box=$("s"+k);
  pick[k]=res[0]||null;
  $("n"+k).textContent=q.trim()?(res.length?"✔ "+res[0].name:"مفيش جهاز بالاسم ده"):"";
  box.innerHTML=res.length>1?res.slice(0,6).map((d,i)=>`<div data-i="${i}">${d.name}</div>`).join(""):"";
  box.hidden=res.length<=1; box._r=res; render();
}
["a","b"].forEach(k=>{
  $(k).addEventListener("input",()=>onType(k));
  $("s"+k).addEventListener("click",e=>{
    const i=e.target.dataset.i; if(i==null) return;
    const d=$("s"+k)._r[i]; $(k).value=d.name; pick[k]=d; $("n"+k).textContent="✔ "+d.name; $("s"+k).hidden=true; render();
  });
});
document.addEventListener("click",e=>{if(!e.target.closest(".field"))document.querySelectorAll(".sug").forEach(s=>s.hidden=true)});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  cat=b.dataset.c; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b)); setCat();
});
function setCat(){
  ["a","b"].forEach((k,i)=>{$(k).value="";$("n"+k).textContent="";pick[k]=null;$(k).placeholder=(i?"الجهاز الثاني":"الجهاز الأول")+" مثال: "+CATS[cat].ph[i]});
  $("chips").innerHTML='<b>🔥 مقارنات سريعة:</b>'+CATS[cat].quick.map((q,i)=>`<button data-i="${i}">${q[0]} ⚔️ ${q[1]}</button>`).join("");
  render();
}
$("chips").addEventListener("click",e=>{
  const i=e.target.dataset.i; if(i==null) return;
  const q=CATS[cat].quick[i]; $("a").value=q[0]; $("b").value=q[1]; onType("a"); onType("b");
  if(pick.a) $("a").value=pick.a.name; if(pick.b) $("b").value=pick.b.name;
  $("sa").hidden=$("sb").hidden=true;
  if(pick.a) $("na").textContent="✔ "+pick.a.name; if(pick.b) $("nb").textContent="✔ "+pick.b.name;
});
function scoreOf(d){const ax=CATS[cat].axes.map(([l,f,w])=>({l,v:f(d)*100,w}));return {ax,total:ax.reduce((s,x)=>s+x.v*x.w,0)}}

function render(){
  const A=pick.a,B=pick.b,C=CATS[cat];
  if(!A||!B){$("out").innerHTML='<div class="card empty"><span class="big">'+C.ico+'</span>اكتب اسم الجهازين بشكل مبسط (أو اختار مقارنة سريعة)<br>وهتظهر المقارنة والتفضيل هنا</div>';return}
  const sa=scoreOf(A),sb=scoreOf(B),ta=Math.round(sa.total),tb=Math.round(sb.total);
  const tie=Math.abs(ta-tb)<3,aw=ta>tb;
  let v;
  if(tie){v=`<div class="w">🤝 متقاربين جداً</div><p>الفرق بين الجهازين (${ta} مقابل ${tb}) صغير، فالاختيار يعتمد على أولوياتك.</p>`;}
  else{
    const W=aw?A:B,Lo=aw?B:A,SW=aw?sa:sb,SL=aw?sb:sa;
    const diffs=SW.ax.map((x,i)=>({l:x.l,d:x.v-SL.ax[i].v}));
    const lead=diffs.filter(x=>x.d>=8).sort((x,y)=>y.d-x.d).slice(0,2).map(x=>x.l);
    const back=diffs.filter(x=>x.d<=-8).sort((x,y)=>x.d-y.d)[0];
    v=`<div class="w">🏆 التفضيل: ${W.name}</div><p>حصل على <b>${Math.max(ta,tb)}</b> من 100 مقابل <b>${Math.min(ta,tb)}</b> لـ ${Lo.name}.</p>`+
      (lead.length?`<p>✅ أقوى في: ${lead.join(" و")}.</p>`:"")+(back?`<p>⚠️ لكن ${Lo.name} أفضل في ${back.l}.</p>`:"");
  }
  const head=(d,t,c,win)=>`<div class="dev ${win?"w":""}" style="--c:${c}">${win?'<div class="crown">👑 الأفضل</div>':""}<div class="ring" style="--p:${t};--c:${c}"><span>${t}</span></div><h3>${d.name}</h3><small>${d.cpu} • ${d.year}</small></div>`;
  const cmp=C.rows.map(([lb,f,g,low])=>{
    const x=g(A),y=g(B);let wa="",wb="";
    if(x!==y){const w=low?x<y:x>y;w?wa="win":wb="win"}
    return `<tr><td>${IC[lb]||""} ${lb}</td><td class="${wa}">${f(A)}</td><td class="${wb}">${f(B)}</td></tr>`}).join("");
  const bars=sa.ax.map((x,i)=>{const y=sb.ax[i];return `<div class="ax"><div class="l"><span>${Math.round(x.v)}</span><b>${x.l}</b><span>${Math.round(y.v)}</span></div><div class="bar"><i class="ba" style="flex:${x.v+1}"></i><i class="bb" style="flex:${y.v+1}"></i></div></div>`}).join("");
  $("out").innerHTML=`
  <div class="heads">${head(A,ta,"var(--a)",!tie&&aw)}${head(B,tb,"var(--b)",!tie&&!aw)}</div>
  <div class="card verdict">${v}<div class="fine">التقييم محسوب من المواصفات فقط (الأداء، البطارية، الشاشة، الذاكرة...) بأوزان مختلفة لكل محور، ومش بيقيس جودة الصورة أو تجربة الاستخدام الفعلية.</div></div>
  <div class="card"><div class="sec">📊 مقارنة المحاور</div>${bars}</div>
  <div class="card tw"><div class="sec" style="padding:8px 6px 0">📋 المواصفات بالتفصيل</div><table><thead><tr><th></th><th class="a">${A.name}</th><th class="b">${B.name}</th></tr></thead><tbody>${cmp}</tbody></table><div class="fine" style="padding:0 6px">الخانة الخضراء = الأفضل في الصف. الأرقام تقريبية.</div></div>`;
}
async function load(){
  $("out").innerHTML='<div class="sk"></div><div class="sk"></div>';
  try{
    const r=await fetch(SB_URL+"/rest/v1/devices?select=*&order=year.desc,name.asc&limit=1000",{headers:{apikey:SB_KEY}});
    if(!r.ok) throw new Error(r.status);
    (await r.json()).forEach(d=>(d.category==="laptops"?L:M).push(d));
    $("cnt").textContent="⚡ "+(M.length+L.length)+" جهاز في قاعدة البيانات";
    setCat();
  }catch(e){
    $("cnt").textContent="⚠️ تعذّر التحميل";
    $("out").innerHTML='<div class="card empty"><span class="big">📡</span>مقدرناش نحمّل الأجهزة، اتأكد من الإنترنت وحاول تاني</div>';
  }
}
setCat();
load();
</script>
</body>
</html>
