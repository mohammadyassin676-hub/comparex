<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparex - مقارنة جميع الأجهزة عالمياً</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 850px; margin: auto; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .selection-box { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box; background-color: #fff; }
        select:focus { border-color: var(--primary); }
        .btn-action { background-color: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        th { background-color: var(--primary); color: white; font-size: 15px; }
        
        .recommendation-box { background: #ecfdf5; border: 2px solid #34d399; color: #065f46; padding: 15px; border-radius: 14px; margin-top: 20px; display: none; text-align: right; }
        .recommendation-box h3 { margin: 0 0 5px 0; color: var(--success); }
        .loading { text-align: center; color: var(--primary); font-weight: bold; display: none; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Comparex 📱💻</h1>
            <p>مقارنة شاملة لجميع الأجهزة الذكية عالمياً</p>
        </header>

        <div class="selection-box">
            <label style="display:block; text-align:right; font-weight:bold; margin-bottom:4px;">الجهاز الأول:</label>
            <select id="device1">
                <option value="">-- جاري تحميل قائمة الأجهزة... --</option>
            </select>

            <label style="display:block; text-align:right; font-weight:bold; margin-top:12px; margin-bottom:4px;">الجهاز الثاني:</label>
            <select id="device2">
                <option value="">-- جاري تحميل قائمة الأجهزة... --</option>
            </select>

            <button class="btn-action" onclick="compareDevices()">عرض المقارنة الشاملة</button>
            <div id="loading" class="loading">⏳ جاري جلب المواصفات التفصيلية...</div>
        </div>

        <div id="recommendationBox" class="recommendation-box">
            <h3>🏆 خلاصة المقارنة والتوصية الفنية:</h3>
            <p id="recText">-</p>
        </div>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>المواصفات</th>
                    <th id="name1">الجهاز الأول</th>
                    <th id="name2">الجهاز الثاني</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>الشاشة</td>
                    <td id="screen1">-</td>
                    <td id="screen2">-</td>
                </tr>
                <tr>
                    <td>المعالج (CPU)</td>
                    <td id="cpu1">-</td>
                    <td id="cpu2">-</td>
                </tr>
                <tr>
                    <td>الرام والمساحة</td>
                    <td id="ram1">-</td>
                    <td id="ram2">-</td>
                </tr>
                <tr>
                    <td>الكاميرا</td>
                    <td id="cam1">-</td>
                    <td id="cam2">-</td>
                </tr>
                <tr>
                    <td>البطارية</td>
                    <td id="battery1">-</td>
                    <td id="battery2">-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = 'https://phone-specs-api.azharimm.dev/v2';
        let allPhones = [];

        // جلب قائمة أشهر الأجهزة العالمية عند فتح الصفحة
        async function fetchAllDevices() {
            try {
                // جلب قائمة الأجهزة الحديثة من الماركات الشهيرة
                const res = await fetch(`${API_BASE}/top-by-interest`);
                const json = await res.json();
                allPhones = json.data.phones || [];

                const select1 = document.getElementById('device1');
                const select2 = document.getElementById('device2');

                select1.innerHTML = '<option value="">-- اختر الجهاز الأول --</option>';
                select2.innerHTML = '<option value="">-- اختر الجهاز الثاني --</option>';

                allPhones.forEach(phone => {
                    const opt1 = document.createElement('option');
                    opt1.value = phone.slug;
                    opt1.textContent = phone.phone_name;
                    select1.appendChild(opt1);

                    const opt2 = document.createElement('option');
                    opt2.value = phone.slug;
                    opt2.textContent = phone.phone_name;
                    select2.appendChild(opt2);
                });
            } catch (err) {
                console.error("فشل جلب الأجهزة من الـ API:", err);
            }
        }

        async function getPhoneDetails(slug) {
            const res = await fetch(`${API_BASE}/${slug}`);
            const json = await res.json();
            return json.data;
        }

        async function compareDevices() {
            const slug1 = document.getElementById('device1').value;
            const slug2 = document.getElementById('device2').value;

            if (!slug1 || !slug2) {
                alert("برجاء اختيار الجهازين من القائمة للمقارنة!");
                return;
            }

            document.getElementById('loading').style.display = 'block';

            try {
                const [d1, d2] = await Promise.all([
                    getPhoneDetails(slug1),
                    getPhoneDetails(slug2)
                ]);

                document.getElementById('name1').innerText = d1.phone_name;
                document.getElementById('name2').innerText = d2.phone_name;

                // استخراج المواصفات الفنية
                const getSpec = (data, title) => {
                    const specGroup = data.specifications.find(s => s.title.toLowerCase().includes(title.toLowerCase()));
                    if (!specGroup) return "-";
                    return specGroup.specs.map(s => s.val.join(', ')).join(' | ');
                };

                document.getElementById('screen1').innerText = getSpec(d1, 'Display');
                document.getElementById('screen2').innerText = getSpec(d2, 'Display');

                document.getElementById('cpu1').innerText = getSpec(d1, 'Platform');
                document.getElementById('cpu2').innerText = getSpec(d2, 'Platform');

                document.getElementById('ram1').innerText = getSpec(d1, 'Memory');
                document.getElementById('ram2').innerText = getSpec(d2, 'Memory');

                document.getElementById('cam1').innerText = getSpec(d1, 'Main Camera');
                document.getElementById('cam2').innerText = getSpec(d2, 'Main Camera');

                document.getElementById('battery1').innerText = getSpec(d1, 'Battery');
                document.getElementById('battery2').innerText = getSpec(d2, 'Battery');

                // التوصية
                let rec = `مقارنة بين <strong>${d1.phone_name}</strong> و <strong>${d2.phone_name}</strong>: `;
                rec += `تأكد من مراجعة تفاصيل الشاشة، المعالج، والبطارية بالأعلى لتحديد الخيار الأمثل حسب استخدامك الشخصي.`;
                document.getElementById('recText').innerHTML = rec;

                document.getElementById('resultTable').style.display = "table";
                document.getElementById('recommendationBox').style.display = "block";
            } catch (err) {
                alert("حدث خطأ أثناء تحميل بيانات المواصفات، حاول مرة أخرى.");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        window.onload = fetchAllDevices;
    </script>
</body>
</html>
