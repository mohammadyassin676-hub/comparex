<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparex - منصة مقارنة الأجهزة</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --gray: #64748b;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 800px; margin: auto; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .selection-box { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        select, input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box; }
        select:focus, input:focus { border-color: var(--primary); }
        .btn-action { background-color: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: none; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        th { background-color: var(--primary); color: white; font-size: 15px; }
        .price-row { font-weight: bold; font-size: 16px; color: var(--primary); }
        .hint { font-size: 12px; color: var(--gray); text-align: right; margin-top: 6px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Comparex 📱💻</h1>
            <p>اختر الفئة وقارن بين الأجهزة بسهولة</p>
        </header>

        <div class="selection-box">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">اختر القسم أولاً:</label>
            <select id="category">
                <option value="mobiles">موبايلات</option>
                <option value="laptops">لابتوبات</option>
            </select>

            <button class="btn-action" onclick="showInputsDirectly()">تأكيد الفئة وإدخال الموديلات</button>

            <div id="inputs" style="display: none; margin-top: 15px;">
                <input type="text" id="device1" placeholder="اكتب الموديل الأول (مثال: iphone 15)...">
                <input type="text" id="device2" placeholder="اكتب الموديل الثاني (مثال: samsung s24 ultra)...">
                
                <div class="hint">
                    <b>أمثلة للموبايلات المتوفرة حالياً:</b><br>
                    • iphone 15 | iphone 14 pro<br>
                    • samsung s24 ultra | samsung s23<br>
                    • xiaomi 13t | realme 11 pro
                </div>

                <button class="btn-action" style="background-color: #16a34a;" onclick="compare()">عرض المقارنة</button>
            </div>
        </div>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>المواصفات</th>
                    <th id="name1">الجهاز الأول</th>
                    <th id="name2">الجهاز الثاني</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>السعر التقديري</td>
                    <td id="price1" class="price-row">-</td>
                    <td id="price2" class="price-row">-</td>
                </tr>
                <tr>
                    <td>الشاشة</td>
                    <td id="screen1">-</td>
                    <td id="screen2">-</td>
                </tr>
                <tr>
                    <td>المعالج</td>
                    <td id="cpu1">-</td>
                    <td id="cpu2">-</td>
                </tr>
                <tr>
                    <td>الرام / المساحة</td>
                    <td id="ram1">-</td>
                    <td id="ram2">-</td>
                </tr>
                <tr>
                    <td>الكاميرا</td>
                    <td id="cam1">-</td>
                    <td id="cam2">-</td>
                </tr>
                <tr>
                    <td>البطارية</td>
                    <td id="battery1">-</td>
                    <td id="battery2">-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // قاعدة البيانات للأجهزة
        const database = {
            mobiles: {
                "iphone 15": { price: "45,000 ج.م", screen: "6.1 بوصة OLED", cpu: "A16 Bionic", ram: "6GB / 128GB", cam: "48 + 12 م.ب", battery: "3349 مللي أمبير" },
                "iphone 14 pro": { price: "42,000 ج.م", screen: "6.1 بوصة OLED 120Hz", cpu: "A16 Bionic", ram: "6GB / 128GB", cam: "48 + 12 + 12 م.ب", battery: "3200 مللي أمبير" },
                "samsung s24 ultra": { price: "55,000 ج.م", screen: "6.8 بوصة AMOLED 120Hz", cpu: "Snapdragon 8 Gen 3", ram: "12GB / 256GB", cam: "200 + 50 + 12 + 10 م.ب", battery: "5000 مللي أمبير" },
                "samsung s23": { price: "35,000 ج.م", screen: "6.1 بوصة AMOLED 120Hz", cpu: "Snapdragon 8 Gen 2", ram: "8GB / 128GB", cam: "50 + 12 + 10 م.ب", battery: "3900 مللي أمبير" },
                "xiaomi 13t": { price: "24,000 ج.م", screen: "6.67 بوصة AMOLED 144Hz", cpu: "Dimensity 8200 Ultra", ram: "12GB / 256GB", cam: "50 + 50 + 12 م.ب", battery: "5000 مللي أمبير" },
                "realme 11 pro": { price: "16,000 ج.م", screen: "6.7 بوصة AMOLED 120Hz", cpu: "Dimensity 7050", ram: "8GB / 256GB", cam: "100 + 2 م.ب", battery: "5000 مللي أمبير" }
            },
            laptops: {
                "macbook air m2": { price: "55,000 ج.م", screen: "13.6 بوصة Retina", cpu: "Apple M2", ram: "8GB / 256GB SSD", cam: "Full HD 1080p", battery: "تدوم حتى 18 ساعة" },
                "dell xps 13": { price: "60,000 ج.م", screen: "13.4 بوصة FHD+", cpu: "Intel Core i7-1360P", ram: "16GB / 512GB SSD", cam: "HD 720p", battery: "تدوم حتى 12 ساعة" }
            }
        };

        function showInputsDirectly() {
            document.getElementById('inputs').style.display = "block";
            document.getElementById('resultTable').style.display = "none";
        }

        function compare() {
            const category = document.getElementById('category').value;
            const dev1 = document.getElementById('device1').value.toLowerCase().trim();
            const dev2 = document.getElementById('device2').value.toLowerCase().trim();

            const data = database[category];

            if (!dev1 || !dev2) {
                alert("برجاء كتابة اسم الموديلين أولاً!");
                return;
            }

            if (!data || !data[dev1] || !data[dev2]) {
                alert("لم يتم العثور على الجهاز. تأكد من كتابة الاسم تماماً كما في أمثلة الموبايلات.");
                return;
            }

            const item1 = data[dev1];
            const item2 = data[dev2];

            document.getElementById('name1').innerText = dev1.toUpperCase();
            document.getElementById('name2').innerText = dev2.toUpperCase();

            document.getElementById('price1').innerText = item1.price;
            document.getElementById('price2').innerText = item2.price;

            document.getElementById('screen1').innerText = item1.screen;
            document.getElementById('screen2').innerText = item2.screen;

            document.getElementById('cpu1').innerText = item1.cpu;
            document.getElementById('cpu2').innerText = item2.cpu;

            document.getElementById('ram1').innerText = item1.ram;
            document.getElementById('ram2').innerText = item2.ram;

            document.getElementById('cam1').innerText = item1.cam;
            document.getElementById('cam2').innerText = item2.cam;

            document.getElementById('battery1').innerText = item1.battery;
            document.getElementById('battery2').innerText = item2.battery;

            document.getElementById('resultTable').style.display = "table";
        }
    </script>
</body>
</html>
