<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparex - مقارنة الأجهزة</title>
<style>
:root{--primary:#2563eb;--bg:#f8fafc;--card:#fff;--text:#1e293b;--gray:#64748b;--win:#dcfce7;--line:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--gray:#94a3b8;--win:#14532d;--line:#334155}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px}
.wrap{max-width:760px;margin:auto}
h1{color:var(--primary);text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:var(--gray);margin:0 0 18px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--primary)}
#inputs{display:none;margin-top:12px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{position:relative}
.sug{position:absolute;top:100%;right:0;left:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:4px;box-shadow:0 6px 16px rgba(0,0,0,.12);overflow:hidden}
.sug div{padding:10px 12px;cursor:pointer;font-size:14px}
.sug div:hover{background:var(--bg)}
.note{font-size:12px;color:var(--gray);margin:6px 2px 0;min-height:16px}
.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--primary)}
td:first-child{color:var(--gray);width:25%}
td.win{background:var(--win);font-weight:bold}
.empty{text-align:center;color:var(--gray);padding:20px 0 6px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Comparex 📱💻</h1>
  <p class="sub">اختار القسم واكتب اسم الجهازين بأي شكل بسيط</p>
  <div class="card">
    <select id="cat">
      <option value="">اختار القسم...</option>
      <option value="mobiles">موبايلات</option>
      <option value="laptops">لابتوبات</option>
    </select>
    <div id="inputs">
      <div class="pick">
        <div class="field"><input id="a" placeholder="الجهاز الأول (مثال: s24)" autocomplete="off"><div class="sug" id="sa" hidden></div><div class="note" id="na"></div></div>
        <div class="field"><input id="b" placeholder="الجهاز الثاني (مثال: ايفون 15)" autocomplete="off"><div class="sug" id="sb" hidden></div><div class="note" id="nb"></div></div>
      </div>
      <div class="tw" id="out"></div>
    </div>
  </div>
</div>
